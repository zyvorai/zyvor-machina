# Machina bare-metal ramdisk: PXE-booted by machines being commissioned or imaged.
# Built by scripts/metal/build-image.sh (Format=directory -> kernel + initrd + squashfs).
# live-boot gives the initramfs `boot=live fetch=URL`, which the iPXE script uses.
[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe

[Output]
Format=directory
ImageId=machina-metal

[Build]
ToolsTree=no

[Content]
Bootable=no
Packages=
    systemd
    systemd-sysv
    udev
    dbus
    linux-image-generic
    initramfs-tools
    live-boot
    iproute2
    iputils-ping
    ca-certificates
    curl
    openssl
    python3
    qemu-utils
    parted
    gdisk
    cloud-guest-utils
    dosfstools
    e2fsprogs
    xfsprogs
    efibootmgr
    xz-utils
    zstd
    lldpd
    smartmontools
    ipmitool
    lshw
    dmidecode
    pciutils
    nvme-cli
    openssh-server
RemoveFiles=
    /var/cache/apt
    /var/lib/apt/lists

# Multi-host control plane (embedded SQLite by default, PostgreSQL build included; scheduler, HA, DRS, AI engine).
name: machina-controller
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Zyvor AI Labs <noreply@zyvor.dev>
description: |
  Machina fleet control plane. Listens on 127.0.0.1:5093 behind the machina daemon's same-origin proxy.
  First install generates /etc/default/machina-platform (JWT secret, agent token, bootstrap admin password).
vendor: Zyvor AI Labs
homepage: https://zyvor.dev
license: LicenseRef-Zyvor-Production-1.0
contents:
  - src: ${STAGE}/bin/machina-controller
    dst: /usr/bin/machina-controller
    file_info: { mode: 0755 }
  - src: ${STAGE}/bin/machina-db
    dst: /usr/bin/machina-db
    file_info: { mode: 0755 }
  - src: ${STAGE}/units/machina-controller.service
    dst: /usr/lib/systemd/system/machina-controller.service
  - src: ${STAGE}/bin/production-preflight
    dst: /usr/libexec/machina/production-preflight
    file_info: { mode: 0755 }
  - src: ${STAGE}/doc/LICENSE
    dst: /usr/share/doc/machina-controller/LICENSE
  - dst: /var/lib/machina
    type: dir
    file_info: { mode: 0750 }
scripts:
  postinstall: ${STAGE}/scripts/machina-controller.postinst
  preremove: ${STAGE}/scripts/machina-controller.prerm
  postremove: ${STAGE}/scripts/machina-controller.postrm
overrides:
  deb:
    depends: [libssl3]
    # podman runs the managed PostgreSQL (machina-db setup pod); optional, SQLite needs nothing
    recommends: [podman]
  rpm:
    depends: [openssl-libs]
    recommends: [podman]

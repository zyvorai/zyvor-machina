# Per-host agent (libvirt executor over gRPC) and the eBPF daemon. Install on every compute node.
name: machina-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Zyvor AI Labs <noreply@zyvor.dev>
description: |
  Machina compute-node agent and machina-bpfd (eBPF datapath: VM firewall, flow telemetry, QEMU sandbox).
  Enrol the host with: machina-agent join --controller URL --token TOKEN
vendor: Zyvor AI Labs
homepage: https://zyvor.dev
license: LicenseRef-Zyvor-Production-1.0
contents:
  - src: ${STAGE}/bin/machina-agent
    dst: /usr/bin/machina-agent
    file_info: { mode: 0755 }
  - src: ${STAGE}/bin/machina-bpfd
    dst: /usr/bin/machina-bpfd
    file_info: { mode: 0755 }
  - src: ${STAGE}/units/machina-agent.service
    dst: /usr/lib/systemd/system/machina-agent.service
  - src: ${STAGE}/units/machina-bpfd.service
    dst: /usr/lib/systemd/system/machina-bpfd.service
  - src: ${STAGE}/doc/LICENSE
    dst: /usr/share/doc/machina-agent/LICENSE
scripts:
  postinstall: ${STAGE}/scripts/machina-agent.postinst
  preremove: ${STAGE}/scripts/machina-agent.prerm
overrides:
  deb:
    depends: [libvirt0, libvirt-daemon-system, qemu-system-x86, qemu-utils, libssl3]
  rpm:
    depends: [libvirt-libs, libvirt-daemon-kvm, qemu-img, openssl-libs]

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/zyvor-favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Linux hypervisor host manager for bare-metal workers: libvirt and QEMU/KVM, web UI, REST API, optional KubeVirt workflows." />
    <title>Machina — Linux hypervisor host manager</title>
    <!-- Boot apple.com white before CSS/JS to avoid Classic Blue FOUC -->
    <script>
      (function () {
        try {
          var key = 'machina-theme'
          var mig = 'machina-theme-migrated-apple-light-v1'
          var t = localStorage.getItem(key)
          if (!localStorage.getItem(mig)) {
            localStorage.setItem(mig, '1')
            if (!t || t === 'dark') {
              t = 'light'
              localStorage.setItem(key, t)
            }
          }
          if (!t) t = 'light'
          var root = document.documentElement
          root.classList.add('machina-clean')
          if (t === 'light') {
            root.classList.add('apple-light', 'light-theme')
            root.dataset.theme = 'tahoe-light'
            root.setAttribute('data-ui-shell', 'tahoe-light')
            root.style.colorScheme = 'light'
            root.style.backgroundColor = '#f5f5f7'
          } else {
            // Dark. The removed steel / aurora / rack themes load as dark too.
            root.dataset.theme = 'tahoe'
            root.setAttribute('data-ui-shell', 'default')
            root.classList.add('liquid-glass-app')
            root.style.colorScheme = 'dark'
          }
        } catch (e) {
          var r = document.documentElement
          r.classList.add('machina-clean', 'apple-light', 'light-theme')
          r.dataset.theme = 'tahoe-light'
          r.setAttribute('data-ui-shell', 'tahoe-light')
          r.style.colorScheme = 'light'
          r.style.backgroundColor = '#f5f5f7'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

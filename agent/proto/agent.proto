// Re-check a stored backup's images (qemu-img check) without touching any VM.
message VerifyBackupRequest {
  string backup_path = 1;
}

message VerifyBackupResponse {
  bool ok = 1;
  string message = 2;
  int32 images_checked = 3;
}

message CloneFromSnapshotRequest {
  string vm_name = 1;
  string snapshot_name = 2;
  string new_name = 3;
  string new_disk_path = 4;
  bool revert_source = 5;
}

message CloneFromSnapshotResponse {
  bool ok = 1;
  string vm_name = 2;
  string uuid = 3;
  string message = 4;
}

message ProvisionStoragePoolRequest {
  string pool_name = 1;
  string backend = 2;
  string path = 3;
}

message ProvisionStoragePoolResponse {
  bool ok = 1;
  string message = 2;
}

message ProvisionNetworkRequest {
  string network_name = 1;
  string backend = 2;
  int32 vlan_id = 3;
  string bridge = 4;
  // Only cloud-isolated accepts these fields; legacy bridge callers leave empty.
  string subnet_cidr = 5;
  string subnet_uuid = 6;
}

message ProvisionNetworkResponse {
  bool ok = 1;
  string message = 2;
}

message AttachDiskRequest {
  string vm_name = 1;
  string disk_path = 2;
  string target_dev = 3;
}

message AttachDiskResponse {
  bool ok = 1;
  string message = 2;

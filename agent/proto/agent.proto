// Reconcile the controller-owned policy set: apply every policy in
// `policies_json` and remove bpfd policies whose id starts with `owned_prefix`
// but are absent from the set.
message BpfSyncPoliciesRequest {
  string policies_json = 1;
  string owned_prefix = 2;
}

message BpfSyncPoliciesResponse {
  bool ok = 1;
  string result_json = 2;
  string message = 3;
}

message PortForwardRuleMsg {
  string id = 1;
  string protocol = 2;
  uint32 host_port = 3;
  string vm_ip = 4;
  uint32 vm_port = 5;
  string description = 6;
}

message ListPortForwardsRequest {}

message ListPortForwardsResponse {
  repeated PortForwardRuleMsg rules = 1;
  string message = 2;
}

message CreatePortForwardRequest {
  string protocol = 1;
  uint32 host_port = 2;
  string vm_ip = 3;
  uint32 vm_port = 4;

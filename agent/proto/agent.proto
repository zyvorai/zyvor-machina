// k3s node operations (install a server, join an agent, upgrade, remove, status). Off unless the
// host sets MACHINA_AGENT_K3S_ENABLED=1; the join token travels only in this message and the
// installer's environment.
message K3sNodeRequest {
  string action = 1; // install_server | join_server | join_agent | upgrade | remove | status | drain | uncordon
  string version = 2;
  string server_url = 3;
  string token = 4;
  string node_name = 5;
  string advertise_address = 6;
  string cluster_cidr = 7;
  string service_cidr = 8;
  string install_url = 9;
  // install_server: start embedded etcd so more servers can join (an HA control plane).
  bool cluster_init = 10;
}

message K3sNodeResponse {
  bool ok = 1;
  string message = 2;
  // Set by install_server: the join token and the admin kubeconfig (127.0.0.1 server address).
  string node_token = 3;
  string kubeconfig = 4;
  // Set by status: the installed k3s version and whether its service is active.
  string version = 5;
  bool active = 6;
  string output_tail = 7;
}

// Copy a backup (file or multi-disk directory) to or from an S3-compatible store with the host's
// aws CLI and credentials, and verify the sizes. The local path must be inside MACHINA_BACKUP_DIR.
message ReplicateBackupRequest {
  string action = 1; // push | fetch | delete (delete ignores local_path)
  string local_path = 2; // push: the backup to upload; fetch: where to put it (must not exist)
  string bucket = 3;
  string key = 4; // object key (a file) or key prefix (a directory)
  string endpoint_url = 5;
}

message ReplicateBackupResponse {
  bool ok = 1;
  string message = 2;
  uint64 bytes = 3;
  uint32 files = 4;
  bool is_dir = 5;
  string remote_uri = 6;
  // SHA-256 of the checksum manifest stored next to the copy; checksummed is false for a copy
  // made before manifests existed (verified by size only).
  string manifest_sha256 = 7;
  bool checksummed = 8;
}

[package]
license = "LicenseRef-Zyvor-Production-1.0"
name = "machina-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
machina-core = { path = "../core" }
machina-spec = { path = "../spec" }
machina-bpf = { path = "../bpf/machina-bpf" }
virt-image-build = { path = "../virt-image-build" }
uuid = { workspace = true }
libc = "0.2"
virt = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tower-http = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
dns-lookup = "4"
axum-server = { workspace = true }
sd-notify = "0.5"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# rustls 0.23 requires an explicit process default CryptoProvider when deps enable multiple backends.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
portable-pty = { workspace = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls"] }
vessel-core = { path = "../vessel" }

[target.'cfg(target_os = "linux")'.dependencies]
pam-client = { workspace = true }
